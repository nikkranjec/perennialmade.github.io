
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perennial</title>

<style>
@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialHair.otf') format('opentype');
  font-weight: 100;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialItalic.otf') format('opentype');
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

@font-face {
  font-family: 'PerennialMade';
  src: url('assets/PerennialMade-Regular-v4.ttf') format('truetype');
  font-display: swap;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #fffdfa;
}

body {
  font-family: 'Mundial', 'Helvetica Neue', sans-serif;
  color: #141414;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

a {
  color: #141414;
  text-decoration: none;
}

a:hover {
  color: #141414;
}

/* FOOTER */
#footer {
  position: relative;
  width: 100%;
  height: 100svh;
  box-sizing: border-box;

  /* Original footerTop */
  padding: 60vh 0 0;

  /* Original paper-card treatment */
  border-radius: min(75px, 9vw) min(75px, 9vw) 0 0;
  border: 1px solid rgba(20, 20, 20, 0.45);

  background:
    #f2f1ef url('assets/grain.png') repeat;

  background-size: 170px 170px;

  box-shadow:
    0 -12px 30px -6px rgba(10, 10, 10, 0.4);

  overflow: hidden;
}

/* TIKTOK */
#footer .tiktok {
  position: absolute;
  left: 47%;
  bottom: 19vw;

  font-family: 'PerennialMade', 'Shadows Into Light', cursive;
  font-size: clamp(19px, 1.9vw, 27px);
  color: #141414;

  transform: rotate(-3deg);
  transform-origin: center;
}



/* INSTAGRAM */
#footer .instagram {
  position: absolute;
  left: 60%;
  bottom: 23.5vw;

  font-family: 'PerennialMade', 'Shadows Into Light', cursive;
  font-size: clamp(19px, 1.9vw, 27px);
  color: #141414;

  transform: rotate(-1deg);
  transform-origin: center;
}



/* CONTACT
   Kept in normal flow exactly like the original.
*/
#footer .contact {
  position: relative;
  z-index: 1;
  margin: 0 0 -12.13vw 5vw;
}

#footer .contact-text {
  text-align: left;
  font-size: clamp(15px, 1.4vw, 20px);
  line-height: 1.45;
}

/* WORDMARK
   Kept in normal flow exactly like the original.
*/
#footer .wordmark-wrap {
  position: relative;
  overflow: hidden;
  margin: 0;
}

#footer .wordmark {
  display: block;
  width: 115vw;
  max-width: none;
  height: auto;
  margin: 0 0 -4.71vw -8.21vw;
}

#footer .copyright {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 1.1vw;

  text-align: center;
  font-size: 12.5px;
  color: #a09b90;
}

/* MOBILE
   Original breakpoint: 719px
*/
@media (max-width: 719px) {

  #footer {
    /* Original mobile footerTop */
    padding: 16vh 0 0;
  }

  #footer .tiktok {
    /* Original mobileTiktok */
    left: 47%;
    bottom: 27vw;
  }

  #footer .instagram {
    /* Original mobileInstagram */
    left: 60%;
    bottom: 39vw;
  }

  #footer .contact {
    /* Original:
       0 0 mobileContactGap vw 5vw
       default mobileContactGap = 0
    */
    margin: 0 0 0 5vw;
  }

  #footer .wordmark-wrap {
    /* Original mobileWordmarkTop = -10.5vw */
    margin: -10.5vw 0 0;
  }

  #footer .wordmark {
    /* Original mobileWordmarkBottom = -1.3vw */
    margin: 0 0 -1.3vw -8.21vw;
  }
}
</style>
</head>

<body>

<footer id="footer">

  <a
    class="tiktok"
    href="https://www.tiktok.com/@perennial.made"
    target="_blank"
    rel="noreferrer"
  >TIKTOK</a>

  <a
    class="instagram"
    href="https://www.instagram.com/perennial.made"
    target="_blank"
    rel="noreferrer"
  >INSTAGRAM</a>

  <div class="contact">
    <div class="contact-text">
      +386 41 815 088<br>
      <a
        href="mailto:info@perennialmade.com"
        onmouseover="this.style.fontStyle='italic'"
        onmouseout="this.style.fontStyle='normal'"
      >info@perennialmade.com</a>
    </div>
  </div>

  <div class="wordmark-wrap">

    <img
      class="wordmark"
      src="assets/IME_perennail.png"
      alt="perennial"
    >

    <div class="copyright">
      all rights reserved @perennial 2026
    </div>

  </div>

</footer>

</body>
</html>
```
