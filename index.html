<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perennial</title>

<style>

/* =========================================================
   FONTS
   ========================================================= */

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialHair.otf') format('opentype');
  font-weight: 100;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialItalic.otf') format('opentype');
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

@font-face {
  font-family: 'PerennialMade';
  src: url('assets/PerennialMade-Regular-v4.ttf') format('truetype');
  font-display: swap;
}


/* =========================================================
   RESET
   ========================================================= */

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #f2f1ef;
}

body {
  font-family: 'Mundial', 'Helvetica Neue', sans-serif;
  color: #141414;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

* {
  box-sizing: border-box;
}

a {
  color: #141414;
  text-decoration: none;
}


/* =========================================================
   FOOTER
   ========================================================= */

#footer {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 100svh;

  overflow: hidden;

  background:
    #f2f1ef url('assets/grain.png') repeat;

  background-size: 170px 170px;

  border-radius: min(75px, 9vw) min(75px, 9vw) 0 0;
  border: 1px solid rgba(20, 20, 20, 0.45);

  box-shadow:
    0 -12px 30px -6px rgba(10, 10, 10, 0.4);
}


/* =========================================================
   SOCIAL LINKS
   ========================================================= */

#footer .tiktok {
  position: absolute;

  left: 47%;
  bottom: 19vw;

  font-family: 'PerennialMade', cursive;
  font-size: clamp(19px, 1.9vw, 27px);
  line-height: 1;

  color: #141414;

  transform: rotate(-3deg);
  transform-origin: center;

  transition: transform 0.3s ease;
}

#footer .tiktok:hover {
  transform: rotate(-3deg) scale(1.07);
}


#footer .instagram {
  position: absolute;

  left: 60%;
  bottom: 23.5vw;

  font-family: 'PerennialMade', cursive;
  font-size: clamp(19px, 1.9vw, 27px);
  line-height: 1;

  color: #141414;

  transform: rotate(-1deg);
  transform-origin: center;

  transition: transform 0.3s ease;
}

#footer .instagram:hover {
  transform: rotate(-1deg) scale(1.07);
}


/* =========================================================
   CONTACT
   ========================================================= */

#footer .contact {
  position: absolute;

  left: 5vw;
  bottom: 0;

  z-index: 2;

  font-size: clamp(15px, 1.4vw, 20px);
  line-height: 1.45;
}

#footer .contact a {
  color: #141414;
}

#footer .contact a:hover {
  font-style: italic;
}


/* =========================================================
   GIANT WORDMARK
   ========================================================= */

#footer .wordmark-wrap {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  overflow: hidden;
}

#footer .wordmark {
  display: block;

  width: 115vw;
  max-width: none;
  height: auto;

  margin:
    0
    0
    -4.71vw
    -8.21vw;
}


/* =========================================================
   COPYRIGHT
   ========================================================= */

#footer .copyright {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 1.1vw;

  z-index: 3;

  text-align: center;

  font-size: 12.5px;
  line-height: 1.2;

  color: #a09b90;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 719px) {

  #footer {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
  }


  #footer .tiktok {
    left: 35%;
    bottom: 27vw;

    font-size: clamp(19px, 1.9vw, 27px);

    transform: rotate(-3deg);
  }

  #footer .tiktok:hover {
    transform: rotate(-3deg) scale(1.07);
  }


  #footer .instagram {
    left: 60%;
    bottom: 39vw;

    font-size: clamp(19px, 1.9vw, 27px);

    transform: rotate(-1deg);
  }

  #footer .instagram:hover {
    transform: rotate(-1deg) scale(1.07);
  }


  #footer .contact {
    left: 5vw;
    bottom: 0;

    margin: 0;

    font-size: clamp(15px, 1.4vw, 20px);
    line-height: 1.45;
  }


  #footer .wordmark-wrap {
    left: 0;
    right: 0;
    bottom: 0;

    margin: 0;
  }


  #footer .wordmark {
    width: 115vw;
    max-width: none;
    height: auto;

    margin:
      0
      0
      -1.3vw
      -8.21vw;
  }


  #footer .copyright {
    bottom: 1.1vw;
    font-size: 11px;
  }
}


/* =========================================================
   VERY NARROW MOBILE
   ========================================================= */

@media (max-width: 380px) {

  #footer .tiktok {
    left: 30%;
  }

  #footer .instagram {
    left: 55%;
  }

  #footer .contact {
    left: 5vw;
  }

}

</style>
</head>


<body>

<footer id="footer">

  <!-- SOCIAL LINKS -->

  <a
    class="tiktok"
    href="https://www.tiktok.com/@perennial.made"
    target="_blank"
    rel="noreferrer"
  >TIKTOK</a>


  <a
    class="instagram"
    href="https://www.instagram.com/perennial.made"
    target="_blank"
    rel="noreferrer"
  >INSTAGRAM</a>


  <!-- CONTACT -->

  <div class="contact">
    +386 41 815 088<br>

    <a href="mailto:info@perennialmade.com">
      info@perennialmade.com
    </a>
  </div>


  <!-- GIANT PERENNIAL WORDMARK -->

  <div class="wordmark-wrap">

    <img
      class="wordmark"
      src="assets/IME_perennail.png"
      alt="perennial"
    >

    <div class="copyright">
      all rights reserved @perennial 2026
    </div>

  </div>

</footer>

</body>
</html>
