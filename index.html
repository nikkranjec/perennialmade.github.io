<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perennial</title>

<style>

/* =========================================================
   FONTS
   ========================================================= */

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialHair.otf') format('opentype');
  font-weight: 100;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialItalic.otf') format('opentype');
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

@font-face {
  font-family: 'PerennialMade';
  src: url('assets/PerennialMade-Regular-v4.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}


/* =========================================================
   RESET
   ========================================================= */

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #f2f1ef;
}

body {
  font-family: 'Mundial', 'Helvetica Neue', sans-serif;
  color: #141414;
  -webkit-font-smoothing: antialiased;

  /* No page scrolling */
  overflow: hidden;
}

* {
  box-sizing: border-box;
}

a {
  color: #141414;
  text-decoration: none;
}


/* =========================================================
   FOOTER
   ========================================================= */

#footer {
  position: relative;

  width: 100%;
  height: 100svh;
  min-height: 100svh;

  overflow: hidden;

  background:
    #f2f1ef url('assets/grain.png') repeat;

  background-size: 170px 170px;

  border-radius:
    min(75px, 9vw)
    min(75px, 9vw)
    0
    0;

  border: 1px solid rgba(20, 20, 20, 0.45);

  box-shadow:
    0 -12px 30px -6px rgba(10, 10, 10, 0.4);
}


/* =========================================================
   SOCIAL LINKS
   These remain independently positioned relative
   to the footer, using VW exactly as intended.
   ========================================================= */

#footer .tiktok {
  position: absolute;

  left: 56%;
  bottom: 21vw;

  font-family: 'PerennialMade', cursive;

  font-size: clamp(19px, 1.9vw, 27px);
  line-height: 1;

  color: #141414;

  transform: rotate(-3deg);
  transform-origin: center;

  transition: transform 0.3s ease;
}

#footer .tiktok:hover {
  transform: rotate(-3deg) scale(1.07);
}


#footer .instagram {
  position: absolute;

  left: 68%;
  bottom: 25vw;

  font-family: 'PerennialMade', cursive;

  font-size: clamp(19px, 1.9vw, 27px);
  line-height: 1;

  color: #141414;

  transform: rotate(-1deg);
  transform-origin: center;

  transition: transform 0.3s ease;
}

#footer .instagram:hover {
  transform: rotate(-1deg) scale(1.07);
}


/* =========================================================
   BOTTOM COMPOSITION
   Contact + wordmark stay in the same flow.

   This is the key fix:
   the whole composition is anchored to the bottom,
   while the elements inside retain their VW geometry.
   ========================================================= */

#footer .bottom-composition {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  width: 100%;
}


/* =========================================================
   CONTACT
   ========================================================= */

#footer .contact {
  position: relative;

  z-index: 2;

  margin:
    0
    0
    -12.13vw
    5vw;

  font-size: clamp(15px, 1.4vw, 20px);
  line-height: 1.45;
}

#footer .contact a {
  color: #141414;
}

#footer .contact a:hover {
  font-style: italic;
}


/* =========================================================
   WORDMARK
   ========================================================= */

#footer .wordmark-wrap {
  position: relative;

  width: 100%;

  overflow: hidden;

  margin: 0;
}

#footer .wordmark {
  display: block;

  width: 115vw;
  max-width: none;
  height: auto;

  margin:
    0
    0
    -4.71vw
    -8.21vw;
}


/* =========================================================
   COPYRIGHT
   ========================================================= */

#footer .copyright {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 1.1vw;

  z-index: 3;

  text-align: center;

  font-size: 12.5px;
  line-height: 1.2;

  color: #a09b90;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 719px) {

  #footer {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
  }


  /* ---------------------------------------------------------
     SOCIAL
     --------------------------------------------------------- */

  #footer .tiktok {
    left: 35%;
    bottom: 27vw;

    font-size: clamp(19px, 1.9vw, 27px);

    transform: rotate(-3deg);
  }

  #footer .tiktok:hover {
    transform: rotate(-3deg) scale(1.07);
  }


  #footer .instagram {
    left: 60%;
    bottom: 39vw;

    font-size: clamp(19px, 1.9vw, 27px);

    transform: rotate(-1deg);
  }

  #footer .instagram:hover {
    transform: rotate(-1deg) scale(1.07);
  }


  /* ---------------------------------------------------------
     CONTACT
     
     Original mobile geometry:
     margin: 0 0 0 5vw
     --------------------------------------------------------- */

  #footer .contact {
    margin:
      0
      0
      0
      5vw;

    font-size: clamp(15px, 1.4vw, 20px);
    line-height: 1.45;
  }


  /* ---------------------------------------------------------
     WORDMARK

     Original mobile geometry:
     wordmark container: -10.5vw
     wordmark bottom:    -1.3vw
     wordmark left:      -8.21vw
     --------------------------------------------------------- */

  #footer .wordmark-wrap {
    margin:
      -10.5vw
      0
      0
      0;
  }


  #footer .wordmark {
    width: 115vw;
    max-width: none;
    height: auto;

    margin:
      0
      0
      -1.3vw
      -8.21vw;
  }


  #footer .copyright {
    bottom: 1.1vw;

    font-size: 11px;
  }
}


/* =========================================================
   VERY NARROW MOBILE
   ========================================================= */

@media (max-width: 380px) {

  #footer .tiktok {
    left: 30%;
  }

  #footer .instagram {
    left: 55%;
  }

  #footer .contact {
    margin-left: 5vw;
  }

}

</style>
</head>


<body>

<footer id="footer">


  <!-- =====================================================
       SOCIAL LINKS
       ===================================================== -->

  <a
    class="tiktok"
    href="https://www.tiktok.com/@perennial.made"
    target="_blank"
    rel="noreferrer"
  >TIKTOK</a>


  <a
    class="instagram"
    href="https://www.instagram.com/perennial.made"
    target="_blank"
    rel="noreferrer"
  >INSTAGRAM</a>


  <!-- =====================================================
       BOTTOM COMPOSITION
       ===================================================== -->

  <div class="bottom-composition">


    <!-- CONTACT -->

    <div class="contact">
      +386 41 815 088<br>

      <a href="mailto:info@perennialmade.com">
        info@perennialmade.com
      </a>
    </div>


    <!-- GIANT PERENNIAL WORDMARK -->

    <div class="wordmark-wrap">

      <img
        class="wordmark"
        src="assets/IME_perennail.png"
        alt="perennial"
      >

      <div class="copyright">
        all rights reserved @perennial 2026
      </div>

    </div>

  </div>

</footer>

</body>
</html>
