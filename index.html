<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Perennial — Footer</title>

<style>
@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialHair.otf') format('opentype');
  font-weight: 100;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Blah Blah Bang';
  src: url('assets/Blah%20blah%20bang.ttf') format('truetype');
  font-display: swap;
}

/* RESET */
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f2f1ef;
}

body {
  font-family: 'Mundial', 'Helvetica Neue', sans-serif;
  color: #141414;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

a {
  color: #141414;
  text-decoration: none;
}

/* FOOTER */
.footer {
  position: relative;
  width: 100vw;
  height: 100svh;
  min-height: 100svh;
  overflow: hidden;

  border-radius: 0;

  background:
    #f2f1ef
    url('assets/grain.png')
    repeat;

  background-size: 170px 170px;
}

/* SOCIAL LINKS */
.social {
  position: absolute;
  z-index: 5;

  font-family: 'Blah Blah Bang',
    'Shadows Into Light',
    cursive;

  font-size: clamp(20px, 2vw, 30px);
  line-height: 1;

  white-space: nowrap;

  transition:
    transform 0.25s ease,
    font-style 0.25s ease;
}

.social:hover {
  font-style: italic;
}

.tiktok {
  left: 47%;
  bottom: 19vh;
  transform: rotate(-3deg);
}

.tiktok:hover {
  transform: rotate(-3deg) scale(1.07);
}

.instagram {
  left: 60%;
  bottom: 23.5vh;
  transform: rotate(-1deg);
}

.instagram:hover {
  transform: rotate(-1deg) scale(1.07);
}

/* CONTACT */
.contact {
  position: absolute;
  z-index: 5;

  left: 5vw;
  bottom: 17vh;

  font-size: clamp(15px, 1.4vw, 20px);
  line-height: 1.45;
}

.contact a:hover {
  font-style: italic;
}

/* GIANT WORDMARK */
.wordmark {
  position: absolute;

  left: 0;
  right: 0;
  bottom: -4.71vw;

  width: 100%;
  overflow: hidden;

  line-height: 0;
}

.wordmark img {
  display: block;

  width: 115vw;
  max-width: none;
  height: auto;

  margin-left: -8.21vw;
}

/* COPYRIGHT */
.copyright {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 1.1vw;

  z-index: 10;

  text-align: center;

  font-size: 12.5px;
  line-height: 1.2;

  color: #a09b90;
}

/* TABLET */
@media (max-width: 900px) {

  .tiktok {
    left: 45%;
    bottom: 18vh;
  }

  .instagram {
    left: 58%;
    bottom: 23vh;
  }

  .contact {
    bottom: 17vh;
  }

  .wordmark img {
    width: 125vw;
    margin-left: -12vw;
  }
}

/* MOBILE */
@media (max-width: 719px) {

  .footer {
    height: 100svh;
    min-height: 100svh;
  }

  .tiktok {
    left: 35%;
    bottom: 27vw;
    font-size: clamp(19px, 5.5vw, 27px);
  }

  .instagram {
    left: 60%;
    bottom: 39vw;
    font-size: clamp(19px, 5.5vw, 27px);
  }

  .contact {
    left: 5vw;
    bottom: 25vw;

    font-size: clamp(15px, 4vw, 20px);
  }

  .wordmark {
    bottom: -1.3vw;
  }

  .wordmark img {
    width: 115vw;
    margin-left: -8.21vw;
  }

  .copyright {
    bottom: 2.5vw;
    font-size: 11px;
  }
}

/* VERY SMALL PHONES */
@media (max-width: 400px) {

  .tiktok {
    left: 30%;
  }

  .instagram {
    left: 55%;
  }

  .contact {
    bottom: 27vw;
  }

  .wordmark img {
    width: 125vw;
    margin-left: -12vw;
  }
}
</style>
</head>

<body>

<footer class="footer">

  <!-- SOCIAL -->
  <a
    class="social tiktok"
    href="https://www.tiktok.com/@perennial.made"
    target="_blank"
    rel="noreferrer"
  >
    TIKTOK
  </a>

  <a
    class="social instagram"
    href="https://www.instagram.com/perennial.made"
    target="_blank"
    rel="noreferrer"
  >
    INSTAGRAM
  </a>

  <!-- CONTACT -->
  <div class="contact">
    +386 41 815 008<br>

    <a href="mailto:info@perennialmade.com">
      info@perennialmade.com
    </a>
  </div>

  <!-- GIANT PERENNIAL WORDMARK -->
  <div class="wordmark">
    <img
      src="assets/IME_perennail.png"
      alt="perennial"
    >
  </div>

  <!-- COPYRIGHT -->
  <div class="copyright">
    all rights reserved @perennial 2026
  </div>

</footer>

</body>
</html>
