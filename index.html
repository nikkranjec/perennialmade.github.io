<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perennial</title>
   <link rel="icon" type="image/png" href="assets/favicon.png">

<meta name="description" content="Kreativni studio za tisto kar ostane.">

<meta property="og:title" content="Perennial">
<meta property="og:description" content="Kreativni studio za tisto kar ostane.">
<meta property="og:image" content="https://perennialmade.com/assets/thumbnail.png">
<meta property="og:url" content="https://perennialmade.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://perennialmade.com/assets/thumbnail.png">
<link rel="preload" href="assets/MundialLight.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="assets/PerennialMade-Regular-v4.ttf" as="font" type="font/ttf" crossorigin>
<style>

/* =========================================================
   FONTS
   ========================================================= */

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialHair.otf') format('opentype');
  font-weight: 100;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 300;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialLight.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

@font-face {
  font-family: 'Mundial';
  src: url('assets/MundialItalic.otf') format('opentype');
  font-weight: 400;
  font-style: italic;
  font-display: block;
}

@font-face {
  font-family: 'PerennialMade';
  src: url('assets/PerennialMade-Regular-v4.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: block;
}


/* =========================================================
   RESET
   ========================================================= */

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #f2f1ef;
}

body {
  font-family: 'Mundial', 'Helvetica Neue', sans-serif;
  color: #141414;
  -webkit-font-smoothing: antialiased;

  /* No page scrolling */
  overflow: hidden;
}

* {
  box-sizing: border-box;
}

a {
  color: #141414;
  text-decoration: none;
}


/* =========================================================
   FOOTER
   ========================================================= */

#footer {
  position: relative;

  width: 100%;
  height: 100svh;
  min-height: 100svh;

  overflow: hidden;

  background:
    #f2f1ef url('assets/grain.png') repeat;

  background-size: 170px 170px;

  border-radius: 0;

  border: 0;

  /* FIX: `box-shadow: 0` is invalid CSS */
  box-shadow: none;
}


/* =========================================================
   SOCIAL LINKS
   These remain independently positioned relative
   to the footer, using VW exactly as intended.

   FIX: z-index lifts them above .bottom-composition
   (which is positioned later in the DOM and was
   covering them, blocking clicks).
   ========================================================= */

#footer .tiktok {
  position: absolute;
  z-index: 5;

  left: 50%;
  bottom: 19vw;

  font-family: 'PerennialMade', cursive;

  font-size: clamp(19px, 1.9vw, 27px);
  line-height: 1;

  color: #141414;

  transform: rotate(-3deg);
  transform-origin: center;

  transition: transform 0.3s ease;
}

#footer .tiktok:hover {
  transform: rotate(-3deg) scale(1.06);
}


#footer .instagram {
  position: absolute;
  z-index: 5;

  left: 64%;
  bottom: 23.5vw;

  font-family: 'PerennialMade', cursive;

  font-size: clamp(19px, 1.9vw, 27px);
  line-height: 1;

  color: #141414;

  transform: rotate(-1deg);
  transform-origin: center;

  transition: transform 0.3s ease;
}

#footer .instagram:hover {
  transform: rotate(-1deg) scale(1.06);
}


/* =========================================================
   BOTTOM COMPOSITION
   Contact + wordmark stay in the same flow.
   Anchored to the bottom; elements inside retain
   their VW geometry.
   ========================================================= */

#footer .bottom-composition {
  position: absolute;
  z-index: 1;

  left: 0;
  right: 0;
  bottom: 0;

  width: 100%;
}


/* =========================================================
   CONTACT
   ========================================================= */

#footer .contact {
  position: relative;

  z-index: 2;

  margin:
    0
    0
    -12.13vw
    5vw;

  font-size: clamp(15px, 1.4vw, 20px);
  line-height: 1.45;
}

#footer .contact a {
  color: #141414;
}


/* =========================================================
   WORDMARK
   ========================================================= */

#footer .wordmark-wrap {
  position: relative;

  width: 100%;

  overflow: hidden;

  margin: 0;
}

#footer .wordmark {
  display: block;

  width: 115vw;
  max-width: none;
  height: auto;

  margin:
    0
    0
    -4.71vw
    -8.21vw;
}


/* =========================================================
   COPYRIGHT
   ========================================================= */

#footer .copyright {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 1.1vw;

  z-index: 3;

  text-align: center;

  font-size: 12.5px;
  line-height: 1.2;

  color: #a09b90;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 719px) {

  #footer {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
  }

  #footer .tiktok {
    left: 45%;
    bottom: 30vw;

    font-size: clamp(19px, 1.9vw, 27px);

    transform: rotate(-3deg);
  }

  #footer .instagram {
    left: 64%;
    bottom: 41vw;

    font-size: clamp(19px, 1.9vw, 27px);

    transform: rotate(-1deg);
  }

  #footer .contact {
    margin:
      0
      0
      0
      5vw;

    font-size: clamp(15px, 1.4vw, 20px);
    line-height: 1.45;
  }

  #footer .wordmark-wrap {
    margin:
      -10.5vw
      0
      0
      0;
  }

  #footer .wordmark {
    width: 115vw;
    max-width: none;
    height: auto;

    margin:
      0
      0
      -1.3vw
      -8.21vw;
  }

  #footer .copyright {
    bottom: 1.1vw;

    font-size: 11px;
  }
}


/* =========================================================
   VERY NARROW MOBILE
   ========================================================= */

@media (max-width: 380px) {

  #footer .tiktok {
    left: 30%;
  }

  #footer .instagram {
    left: 55%;
  }

  #footer .contact {
    margin-left: 5vw;
  }

}

</style>
</head>


<body>

<footer id="footer">

  <!-- SOCIAL LINKS -->

  <a
    class="tiktok"
    href="https://www.tiktok.com/@perennial.made"
    target="_blank"
    rel="noopener noreferrer"
  >TIKTOK</a>

  <a
    class="instagram"
    href="https://www.instagram.com/perennial.made"
    target="_blank"
    rel="noopener noreferrer"
  >INSTAGRAM</a>


  <!-- BOTTOM COMPOSITION -->

  <div class="bottom-composition">

    <div class="contact">
      +386 41 815 088<br>
      <a href="mailto:info@perennialmade.com">info@perennialmade.com</a>
    </div>

    <div class="wordmark-wrap">

      <img
        class="wordmark"
        src="assets/IME_perennail.png"
        alt="perennial"
      >

      <div class="copyright">
        all rights reserved @perennial 2026
      </div>

    </div>

  </div>

</footer>

</body>
</html>
